
spring.application.name=weather-backend

# Use the port provided by the hosting platform.
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weather_app?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# WeatherAPI
weather.api.base-url=https://api.weatherapi.com/v1
weather.api.key=${WEATHER_API_KEY:}

spring.jackson.serialization.write-dates-as-timestamps=false
